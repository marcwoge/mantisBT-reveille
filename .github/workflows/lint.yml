name: PHP Lint

on:
  push:
    branches: [ main, master ]
  pull_request:

permissions:
  contents: read

jobs:
  php-lint:
    name: Syntax check (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.3', '8.4']

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none

      - name: Lint all PHP files
        run: |
          set -e
          find . -type f -name '*.php' -print0 \
            | xargs -0 -n1 -P4 php -l
