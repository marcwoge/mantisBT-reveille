# Reveille – local test environment.
#
# Brings up MantisBT (PHP 7.4) + MySQL 8 with the plugin live-mounted so you can
# edit the plugin on the host and refresh the browser.
#
#   docker compose up -d --build
#   -> MantisBT on http://localhost:8080
#
# See README_DOCKER.md for the one-time install + seed steps.

services:
  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: bugtracker
      MYSQL_USER: mantis
      MYSQL_PASSWORD: mantis
    # MySQL is only reachable from within the compose network (no host port).
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      # Live plugin development: the repository root is mounted as the plugin.
      - ../:/var/www/html/plugins/Reveille
      # Pre-baked MantisBT configuration (DB credentials + deferred status).
      - ./config_inc.php:/var/www/html/config/config_inc.php
      # Language labels for the custom "deferred" status (Change Status page).
      - ./custom_strings_inc.php:/var/www/html/config/custom_strings_inc.php

volumes:
  db_data:
